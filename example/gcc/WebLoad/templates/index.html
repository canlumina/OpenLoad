<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenLoad Web管理器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-cpu"></i> OpenLoad Web管理器
            </a>
            <div class="navbar-nav ms-auto">
                <div class="nav-item">
                    <span class="navbar-text" id="connection-status">
                        <i class="bi bi-circle-fill text-danger"></i> 未连接
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 左侧面板 -->
            <div class="col-md-4">
                <!-- 串口连接 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-usb-symbol"></i> 串口连接
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="serial-port" class="form-label">串口</label>
                            <select class="form-select" id="serial-port">
                                <option value="">选择串口...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="baudrate" class="form-label">波特率</label>
                            <select class="form-select" id="baudrate">
                                <option value="115200" selected>115200</option>
                                <option value="57600">57600</option>
                                <option value="38400">38400</option>
                                <option value="19200">19200</option>
                                <option value="9600">9600</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button class="btn btn-success" id="connect-btn" onclick="connectSerial()">
                                <i class="bi bi-plug"></i> 连接
                            </button>
                            <button class="btn btn-danger" id="disconnect-btn" onclick="disconnectSerial()" disabled>
                                <i class="bi bi-plug-fill"></i> 断开
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 设备信息 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-info-circle"></i> 设备信息
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <tr>
                                <td><strong>MCU:</strong></td>
                                <td id="device-mcu">-</td>
                            </tr>
                            <tr>
                                <td><strong>Bootloader:</strong></td>
                                <td id="device-bootloader">-</td>
                            </tr>
                            <tr>
                                <td><strong>Flash大小:</strong></td>
                                <td id="device-flash">-</td>
                            </tr>
                            <tr>
                                <td><strong>最后更新:</strong></td>
                                <td id="device-update">-</td>
                            </tr>
                        </table>
                        <button class="btn btn-outline-primary btn-sm" onclick="getDeviceInfo()">
                            <i class="bi bi-arrow-clockwise"></i> 刷新
                        </button>
                    </div>
                </div>

                <!-- Bootloader命令 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-terminal"></i> Bootloader命令
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-info btn-sm" onclick="sendBootloaderCommand('help')">
                                <i class="bi bi-question-circle"></i> 帮助 (help)
                            </button>
                            <button class="btn btn-outline-warning btn-sm" onclick="sendBootloaderCommand('erase')">
                                <i class="bi bi-trash"></i> 擦除应用 (erase)
                            </button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="sendBootloaderCommand('backup')">
                                <i class="bi bi-download"></i> 备份固件 (backup)
                            </button>
                            <button class="btn btn-outline-success btn-sm" onclick="sendBootloaderCommand('restore')">
                                <i class="bi bi-upload"></i> 恢复固件 (restore)
                            </button>
                            <button class="btn btn-outline-primary btn-sm" onclick="sendBootloaderCommand('jump')">
                                <i class="bi bi-play"></i> 跳转应用 (jump)
                            </button>
                            <button class="btn btn-outline-danger btn-sm" onclick="sendBootloaderCommand('reset')">
                                <i class="bi bi-arrow-clockwise"></i> 系统复位 (reset)
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <div class="col-md-8">
                <!-- 固件升级 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="firmware-tabs">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="tab" href="#upload-tab">
                                    <i class="bi bi-cloud-upload"></i> 固件上传
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#update-tab">
                                    <i class="bi bi-arrow-up-circle"></i> 固件升级
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#manage-tab">
                                    <i class="bi bi-files"></i> 文件管理
                                </a>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content">
                            <!-- 固件上传标签页 -->
                            <div class="tab-pane fade show active" id="upload-tab">
                                <div class="mb-3">
                                    <label for="firmware-file" class="form-label">选择固件文件 (.bin)</label>
                                    <input class="form-control" type="file" id="firmware-file" accept=".bin">
                                </div>
                                <button class="btn btn-primary" onclick="uploadFirmware()">
                                    <i class="bi bi-upload"></i> 上传固件
                                </button>
                            </div>

                            <!-- 固件升级标签页 -->
                            <div class="tab-pane fade" id="update-tab">
                                <form id="update-form">
                                    <div class="mb-3">
                                        <label for="firmware-select" class="form-label">选择固件</label>
                                        <select class="form-select" id="firmware-select">
                                            <option value="">请先上传固件文件</option>
                                        </select>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-4">
                                            <label class="form-label">升级方式</label>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="update-type" id="xmodem-type" value="xmodem" checked>
                                                <label class="form-check-label" for="xmodem-type">XMODEM (串口)</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="update-type" id="ota-type" value="ota">
                                                <label class="form-check-label" for="ota-type">OTA (WiFi)</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">目标位置</label>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="target" id="internal-target" value="internal" checked>
                                                <label class="form-check-label" for="internal-target">内部Flash</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="target" id="external-target" value="external">
                                                <label class="form-check-label" for="external-target">外部Flash</label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">加密方式</label>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="encryption" id="no-encryption" value="none" checked>
                                                <label class="form-check-label" for="no-encryption">无加密</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="encryption" id="xor-encryption" value="xor">
                                                <label class="form-check-label" for="xor-encryption">XOR加密</label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="encryption" id="aes-encryption" value="aes">
                                                <label class="form-check-label" for="aes-encryption">AES-128-CBC</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="mt-3">
                                        <button type="button" class="btn btn-warning" onclick="startFirmwareUpdate()">
                                            <i class="bi bi-arrow-up-circle"></i> 开始升级
                                        </button>
                                    </div>
                                </form>
                                
                                <!-- 升级进度 -->
                                <div class="mt-3" id="update-progress" style="display: none;">
                                    <div class="progress">
                                        <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                             id="progress-bar" role="progressbar" style="width: 0%">
                                        </div>
                                    </div>
                                    <small class="text-muted" id="progress-message">准备中...</small>
                                </div>
                            </div>

                            <!-- 文件管理标签页 -->
                            <div class="tab-pane fade" id="manage-tab">
                                <div class="mb-3">
                                    <button class="btn btn-outline-primary btn-sm" onclick="refreshFirmwareList()">
                                        <i class="bi bi-arrow-clockwise"></i> 刷新列表
                                    </button>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th>文件名</th>
                                                <th>大小</th>
                                                <th>上传时间</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody id="firmware-list">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted">暂无固件文件</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 串口终端 -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-terminal"></i> 串口终端</span>
                        <div>
                            <button class="btn btn-outline-secondary btn-sm" onclick="clearTerminal()">
                                <i class="bi bi-trash"></i> 清除
                            </button>
                            <div class="form-check form-switch d-inline-block ms-2">
                                <input class="form-check-input" type="checkbox" id="auto-scroll" checked>
                                <label class="form-check-label" for="auto-scroll">自动滚动</label>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="terminal" class="terminal"></div>
                        <div class="input-group mt-2">
                            <input type="text" class="form-control" id="command-input" placeholder="输入命令...">
                            <button class="btn btn-outline-secondary" onclick="sendCommand()">
                                <i class="bi bi-send"></i> 发送
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">OpenLoad</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-body">
                消息内容
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
